<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242f40">
  <title>Sign in | YourBrand</title>
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <!-- PAGE 01: SIGN IN -->
  <main class="auth-page">
    <div class="auth-shell">
      <p class="page-label">Your workspace starts here</p>
      <a class="auth-brand" href="01-get-started.html" aria-label="YourBrand home">Your<span>Brand</span></a>
      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome back</h1>
        <p class="auth-intro">Sign in to pick up where you left off.</p>
        <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
        <form class="auth-form" id="loginForm" novalidate>
          <div class="form-field">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>
          <button class="button button--full" type="submit">Sign in</button>
        </form>
        <p class="auth-footer">New to YourBrand? <a href="02-register.html">Create an account</a></p>
      </section>
      <p class="auth-note">A simple place to keep your plans, updates and resources together.</p>
    </div>
  </main>
  <script src="auth.js"></script>
</body>
</html>
